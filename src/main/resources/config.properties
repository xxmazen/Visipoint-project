# Visipoint Test Automation Framework Configuration

# ============= APPLICATION PROPERTIES =============
# Base URL for the application
property.basepath=https://www.visipoint.me/login

# Alternative URLs (if needed)
property.basepath.staging=https://staging.visipoint.me/login
property.basepath.dev=https://dev.visipoint.me/login

# ============= BROWSER CONFIGURATION =============
# Browser type: chrome, firefox, safari, edge
browser.name=chrome
browser.headless=false
browser.maximize=true

# ============= WAIT TIMES (seconds) =============
wait.implicit=5
wait.explicit=5
wait.fluent=10

# ============= TEST EXECUTION =============
# Parallel execution: true or false
test.parallel=true
test.thread.count=4

# Retry failed tests
test.retry.count=2
test.screenshot.on.failure=true

# ============= LOGGING =============
# Log level: TRACE, DEBUG, INFO, WARN, ERROR
log.level=DEBUG
log.output.directory=logs
log.file.name=test-execution.log

# ============= REPORTING =============
# Report directory
report.directory=test-reports
report.format=html

# ============= TEST DATA =============
# Valid test credentials
test.email=test@visipoint.me
test.password=TestPassword123
test.phone=12345678901

# ============= TIMEOUTS =============
page.load.timeout=30
implicit.wait=10
explicit.wait=5

# ============= ELEMENT PROPERTIES =============
# Polling interval for wait conditions (milliseconds)
polling.interval=500

# ============= ENVIRONMENT =============
# Environment: local, dev, staging, production
environment=local

# ============= FLAGS =============
# Enable detailed logging
flag.detailed.logs=true

# Enable screenshots on every step
flag.screenshot.on.step=false

# Enable video recording
flag.video.recording=false

# Continue on test failure
flag.continue.on.failure=false

